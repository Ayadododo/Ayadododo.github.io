<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新页面 · /1/</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            color: #1a1a1a;
            text-align: center;
            padding: 24px;
        }
        main { max-width: 480px; }
        h1 { font-size: 1.8em; margin-bottom: 12px; }
        p { color: #666; line-height: 1.7; margin-bottom: 8px; }
        code {
            background: #eee;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 0.9em;
        }
        a.back {
            display: inline-block;
            margin-top: 24px;
            color: #1a1a1a;
            font-size: 0.9em;
            text-decoration: none;
            border-bottom: 1px solid #bbb;
            padding-bottom: 2px;
        }
        a.back:hover { border-color: #1a1a1a; }
    </style>
</head>
<body>
    <main>
        <h1>🚧 这是一个独立的新页面</h1>
        <p>路径：<code>/1/</code></p>
        <p>它与主页互不影响：独立的 HTML、样式与脚本，可随意增删内容。</p>
        <p>编辑 <code>1/index.html</code> 即可修改本页。</p>
        <a class="back" href="/">← 返回主页</a>
    </main>
</body>
</html>
