<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARAM 一图流 · 海克斯大乱斗自用攻略</title>
    <style>
        :root {
            --bg: #0a0e14;
            --bg-card: #111820;
            --bg-hover: #1a2230;
            --bg-input: #151d28;
            --border: #1e2a3a;
            --text: #c8d0dc;
            --text-dim: #5a6a7a;
            --gold: #c89b3c;
            --gold-bright: #f0c850;
            --tier-s: #e84057;
            --tier-a: #4a9eff;
            --tier-b: #6b7a8a;
            --green: #3ddc84;
            --radius: 10px;
            --radius-sm: 6px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 12px 14px; }

        /* ===== 顶栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            margin-bottom: 10px;
        }
        .top-bar h1 {
            font-size: 1.15em;
            color: var(--gold-bright);
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .top-bar .ver {
            font-size: 0.75em;
            color: var(--text-dim);
            margin-left: auto;
            white-space: nowrap;
        }

        /* ===== 搜索 + 筛选 ===== */
        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .search-box {
            flex: 1;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 34px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.95em;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--gold); }
        .search-box input::placeholder { color: var(--text-dim); }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85em;
            pointer-events: none;
        }
        .filters {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filter-btn {
            padding: 5px 12px;
            font-size: 0.8em;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: rgba(200, 155, 60, 0.15);
            border-color: var(--gold);
            color: var(--gold-bright);
        }
        .filter-btn:hover { border-color: var(--gold); }

        /* ===== 英雄网格 ===== */
        .champ-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .champ-cell {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .champ-cell:hover, .champ-cell.selected {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(200, 155, 60, 0.3);
        }
        .champ-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .champ-cell .champ-name-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3px 4px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            font-size: 0.7em;
            text-align: center;
            color: #ddd;
            pointer-events: none;
        }
        .rank-badge {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.65em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: none;
            z-index: 2;
            border: 1px solid rgba(0,0,0,0.4);
        }
        .rank-badge.r1 { background: #e84057; }
        .rank-badge.r2 { background: #c89b3c; }
        .rank-badge.r3 { background: #4a9eff; }
        .rank-badge.r4 { background: #6b7a8a; }
        .no-results {
            text-align: center;
            padding: 40px 0;
            color: var(--text-dim);
            font-size: 0.95em;
        }

        /* ===== 详情面板 ===== */
        .detail-panel {
            display: none;
            background: var(--bg-card);
            border-radius: var(--radius) var(--radius) 0 0;
            border: 1px solid var(--border);
            border-bottom: none;
            padding: 16px 14px 24px;
            animation: slideUp 0.3s ease;
        }
        .detail-panel.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 详情头部 */
        .detail-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .detail-portrait {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            flex-shrink: 0;
        }
        .detail-info h2 {
            font-size: 1.3em;
            color: #fff;
            margin-bottom: 4px;
        }
        .detail-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stat-chip {
            font-size: 0.78em;
            padding: 3px 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            color: var(--text);
        }
        .stat-chip b { color: var(--gold-bright); }
        .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.4em;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .close-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* 流派 Tab */
        .build-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .build-tabs::-webkit-scrollbar { display: none; }
        .build-tab {
            padding: 8px 16px;
            font-size: 0.85em;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .build-tab.active {
            background: rgba(200, 155, 60, 0.12);
            border-color: var(--gold);
            color: var(--gold-bright);
            font-weight: 600;
        }

        /* 流派内容区 */
        .build-content { display: none; }
        .build-content.active { display: block; }

        .section-label {
            font-size: 0.75em;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        /* 装备路线 */
        .items-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .item-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid #333;
            object-fit: cover;
            flex-shrink: 0;
        }
        .item-icon.boots { border-color: #6a4; }
        .item-icon.core  { border-color: var(--gold); }
        .item-sep {
            color: var(--text-dim);
            font-size: 0.9em;
            flex-shrink: 0;
        }

        /* 可选装备 */
        .optional-items {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .optional-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 0.78em;
            color: var(--text);
        }
        .optional-item img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* 海克斯强化 */
        .augment-section { margin-bottom: 14px; }
        .augment-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .augment-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .augment-row:hover {
            background: rgba(255,255,255,0.06);
            border-color: #444;
        }
        .augment-row.expanded .augment-desc {
            display: block;
        }
        .augment-tier {
            font-size: 0.7em;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .augment-tier.S { background: rgba(232, 64, 87, 0.2); color: var(--tier-s); }
        .augment-tier.A { background: rgba(74, 158, 255, 0.15); color: var(--tier-a); }
        .augment-tier.B { background: rgba(107, 122, 138, 0.15); color: var(--tier-b); }
        .augment-name {
            font-size: 0.88em;
            color: #e0e6ee;
            flex: 1;
            min-width: 0;
        }
        .augment-desc {
            display: none;
            font-size: 0.78em;
            color: var(--text-dim);
            margin-top: 2px;
            line-height: 1.4;
        }
        .augment-tip {
            font-size: 0.78em;
            color: var(--gold);
            text-align: right;
            flex-shrink: 0;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 16px 0;
            font-size: 0.75em;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }
        .footer a { color: var(--gold); text-decoration: none; }

        /* ===== 响应式 ===== */
        @media (min-width: 480px) {
            .champ-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; }
        }
        @media (min-width: 640px) {
            .champ-grid { grid-template-columns: repeat(6, 1fr); gap: 10px; }
            .detail-portrait { width: 72px; height: 72px; }
            .item-icon { width: 44px; height: 44px; }
        }
        @media (min-width: 800px) {
            .champ-grid { grid-template-columns: repeat(8, 1fr); gap: 12px; }
            .container { padding: 16px 20px; }
        }

        /* 工具提示 */
        .tooltip {
            position: fixed;
            background: #1a2230;
            border: 1px solid #3a4a5a;
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 0.8em;
            color: var(--text);
            max-width: 220px;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
        }
        .tooltip.show { display: block; }
        .tooltip .tt-name { color: var(--gold-bright); font-weight: 600; margin-bottom: 3px; }
        .tooltip .tt-desc { color: #aaa; line-height: 1.4; }
    </style>
</head>

// ============================================================
// 应用状态
// ============================================================
let currentChamp = null;
let currentBuildIdx = 0;
let activeFilter = 'all';
let searchQuery = '';

// ============================================================
// 工具函数
// ============================================================
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

// 拼音首字母简拼（简单实现，覆盖常见场景）
function toPinyinAbbr(str) {
    const map = {
        '寒':'h','冰':'b','射':'s','手':'s','光':'g','辉':'h','女':'n','郎':'l',
        '无':'w','极':'j','剑':'j','圣':'s','琴':'q','瑟':'s','仙':'x','暴':'b',
        '走':'z','萝':'l','莉':'l','发':'f','条':'t','魔':'m','鬼':'g','才':'c',
        '邪':'x','恶':'e','小':'x','法':'f','师':'s','末':'m','日':'r','天':'t',
        '使':'s','虚':'x','空':'k','之':'z','眼':'y','金':'j','克':'k','斯':'s',
        '德':'d','玛':'m','西':'x','亚':'y','暗':'a','夜':'y','猎':'l','人':'r',
        '赏':'s','金':'j','猎':'l','寡':'g','妇':'f','刀':'d','锋':'f','之':'z',
        '影':'y','劫':'j','不':'b','祥':'x','之':'z','刃':'r','卡':'k','特':'t',
        '琳':'l','娜':'n','安':'a','妮':'n','阿':'a','木':'m','姆':'m','墨':'m',
        '菲':'f','特':'t','拉':'l','凯':'k','尔':'e','瓦':'w','洛':'l','兰':'l',
        '博':'b','慎':'s','李':'l','青':'q','盲':'m','僧':'s','赵':'z','信':'x',
        '盖':'g','伦':'l','拉':'l','克':'k','丝':'s','薇':'w','恩':'e','烬':'j',
        '韦':'w','鲁':'l','斯':'s','泽':'z','丽':'l','佐':'z','妮':'n','蔻':'k',
        '塞':'s','拉':'l','索':'s','斯':'s','永':'y','恩':'e','亚':'y','索':'s',
        '萨':'s','科':'k','易':'y','奥':'a','拉':'l','夫':'f','蛮':'m','王':'w',
        '提':'t','莫':'m','锐':'r','雯':'w','薇':'w','恩':'e','卡':'k','莎':'s',
        '玛':'m','尔':'e','扎':'z','哈':'h','科':'k','加':'j','斯':'s','伊':'y',
        '泽':'z','瑞':'r','尔':'e','辛':'x','德':'d','拉':'l','维':'w','克':'k',
        '托':'t','斯':'s','基':'j','兰':'l','博':'b',
        '河':'h','流':'l','皮':'p','城':'c','警':'j','迅':'x','捷':'j',
        '斥':'c','候':'h','徒':'t','外':'w','狂':'k',
    };
    return str.split('').map(c => map[c] || c).join('').toLowerCase();
}

// ============================================================
// 渲染英雄网格
// ============================================================
function renderGrid() {
    const grid = $('#champGrid');
    const noRes = $('#noResults');

    const filtered = CHAMPIONS.filter(c => {
        const matchRole = activeFilter === 'all' || c.roles.includes(activeFilter);
        const q = searchQuery.toLowerCase();
        const matchSearch = !q ||
            c.name.includes(q) ||
            c.id.toLowerCase().includes(q) ||
            toPinyinAbbr(c.name).includes(q);
        return matchRole && matchSearch;
    });

    if (filtered.length === 0) {
        grid.innerHTML = '';
        noRes.style.display = 'block';
        return;
    }
    noRes.style.display = 'none';

    grid.innerHTML = filtered.map(c => `
        <div class="champ-cell ${currentChamp && currentChamp.id === c.id ? 'selected' : ''}"
             data-id="${c.id}">
            ${c.rank ? `<div class="rank-badge r${c.rank}">${c.rank}</div>` : ''}
            <img src="${CHAMP_IMG(c.id)}" alt="${c.name}" loading="lazy"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231a2230%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2258%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2224%22>${c.name[0]}</text></svg>'">
            <div class="champ-name-tag">${c.name}</div>
        </div>
    `).join('');

    grid.querySelectorAll('.champ-cell').forEach(cell => {
        cell.addEventListener('click', () => {
            const champ = CHAMPIONS.find(c => c.id === cell.dataset.id);
            if (champ) selectChamp(champ);
        });
    });
}

// ============================================================
// 选中英雄 → 展开详情
// ============================================================
function selectChamp(champ) {
    currentChamp = champ;
    // 恢复上次的流派 tab
    const saved = localStorage.getItem('aram_build_' + champ.id);
    currentBuildIdx = saved ? parseInt(saved, 10) : 0;
    if (currentBuildIdx >= champ.builds.length) currentBuildIdx = 0;

    renderGrid();
    renderDetail();
    const panel = $('#detailPanel');
    panel.classList.add('show');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    localStorage.setItem('aram_last_champ', champ.id);
}

// ============================================================
// 渲染详情面板
// ============================================================
function renderDetail() {
    const c = currentChamp;
    if (!c) return;

    // 头部
    $('#detailPortrait').src = CHAMP_IMG(c.id);
    $('#detailName').textContent = c.name;
    $('#detailStats').innerHTML = `
        <span class="stat-chip">Tier <b>${c.tier}</b></span>
        <span class="stat-chip">胜率 <b>${c.winRate}</b></span>
        <span class="stat-chip">流派 <b>${c.builds.length}</b></span>
    `;

    // 流派 Tab
    $('#buildTabs').innerHTML = c.builds.map((b, i) => `
        <div class="build-tab ${i === currentBuildIdx ? 'active' : ''}" data-idx="${i}">
            ${b.name}
        </div>
    `).join('');

    $('#buildTabs').querySelectorAll('.build-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            currentBuildIdx = parseInt(tab.dataset.idx, 10);
            localStorage.setItem('aram_build_' + c.id, currentBuildIdx);
            renderDetail();
        });
    });

    // 流派内容
    renderBuildContent();
}

// ============================================================
// 渲染单个流派的装备 + 海克斯
// ============================================================
function renderBuildContent() {
    const b = currentChamp.builds[currentBuildIdx];
    const container = $('#buildContents');

    let html = '<div class="build-content active">';

    // 流派描述
    html += `<p style="font-size:0.85em;color:var(--text-dim);margin-bottom:12px;">
        ${b.desc} · <b style="color:var(--gold)">${b.skillOrder}</b>
    </p>`;

    // 核心装备
    html += '<div class="section-label">🛠 核心装备</div>';
    html += '<div class="items-row">';
    b.coreItems.forEach((item, i) => {
        if (i > 0) html += '<span class="item-sep">›</span>';
        html += `<img class="item-icon core" src="${ITEM_IMG(item.id)}" alt="${item.name}"
                      data-tip-name="${item.name}" data-tip-desc="${item.tip}"
                      onerror="this.style.display='none'">`;
    });
    html += '</div>';

    // 可选装备
    if (b.optionalItems && b.optionalItems.length > 0) {
        html += '<div class="section-label" style="margin-top:10px">📦 可选装备</div>';
        html += '<div class="optional-items">';
        b.optionalItems.forEach(item => {
            html += `<div class="optional-item" data-tip-name="${item.name}" data-tip-desc="灵活选择">
                <img src="${ITEM_IMG(item.id)}" alt="${item.name}" onerror="this.style.display='none'">
                <span>${item.name}</span>
            </div>`;
        });
        html += '</div>';
    }

    // 海克斯强化
    html += '<div class="augment-section">';
    html += '<div class="section-label">💎 海克斯强化推荐</div>';
    html += '<div class="augment-list">';
    b.augments.forEach(aug => {
        html += `
            <div class="augment-row" onclick="this.classList.toggle('expanded')">
                <span class="augment-tier ${aug.tier}">${aug.tier}</span>
                <div class="augment-name">
                    ${aug.name}
                    <div class="augment-desc">${aug.desc}</div>
                </div>
                <span class="augment-tip">${aug.tip}</span>
            </div>`;
    });
    html += '</div></div>';

    // 流派备注
    if (b.buildNote) {
        html += `<p style="font-size:0.82em;color:var(--gold);margin-top:8px;text-align:center;">💡 ${b.buildNote}</p>`;
    }

    html += '</div>';
    container.innerHTML = html;
}

// ============================================================
// 筛选 & 搜索
// ============================================================
$('#filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    $$('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.role;
    renderGrid();
});

$('#searchInput').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderGrid();
});

// 关闭详情
$('#closeDetail').addEventListener('click', () => {
    currentChamp = null;
    $('#detailPanel').classList.remove('show');
    renderGrid();
});

// ============================================================
// 装备/海克斯悬浮提示（桌面端）
// ============================================================
const tooltip = $('#tooltip');
document.addEventListener('mouseover', e => {
    const tipEl = e.target.closest('[data-tip-name]');
    if (!tipEl) { tooltip.classList.remove('show'); return; }
    $('#ttName').textContent = tipEl.dataset.tipName;
    $('#ttDesc').textContent = tipEl.dataset.tipDesc || '';
    tooltip.classList.add('show');
});
document.addEventListener('mousemove', e => {
    if (!tooltip.classList.contains('show')) return;
    const x = Math.min(e.clientX + 12, window.innerWidth - 230);
    const y = Math.min(e.clientY + 12, window.innerHeight - 80);
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
});
document.addEventListener('mouseout', e => {
    if (!e.target.closest('[data-tip-name]')) tooltip.classList.remove('show');
});

// ============================================================
// 初始化
// ============================================================
(function init() {
    renderGrid();
    // 恢复上次选中的英雄
    const lastId = localStorage.getItem('aram_last_champ');
    if (lastId) {
        const champ = CHAMPIONS.find(c => c.id === lastId);
        if (champ) selectChamp(champ);
    }
})();
</script>
